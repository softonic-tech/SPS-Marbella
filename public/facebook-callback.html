<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connecting Facebook…</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fbfaf7;
        color: #292722;
        font-family: 'DM Sans', system-ui, sans-serif;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-family: Georgia, serif;
        font-weight: 400;
        font-size: 1.75rem;
      }
      p {
        line-height: 1.5;
        color: #77736c;
      }
      .err {
        color: #8b3a3a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Connecting Facebook</h1>
      <p id="status">Saving your Page token…</p>
    </main>
    <script>
      (async () => {
        const status = document.getElementById('status');
        const params = new URLSearchParams(window.location.search);
        const error = params.get('error_description') || params.get('error');
        if (error) {
          status.className = 'err';
          status.textContent = error;
          setTimeout(() => {
            window.location.href = '/admin?fb=error&msg=' + encodeURIComponent(error);
          }, 1200);
          return;
        }

        const code = params.get('code') || '';
        const state = params.get('state') || '';
        if (!code || !state) {
          status.className = 'err';
          status.textContent = 'Missing Facebook code. Start again from Admin → Connect Facebook.';
          return;
        }

        try {
          const response = await fetch('/api/facebook-callback', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'ngrok-skip-browser-warning': 'true',
            },
            body: JSON.stringify({ code, state }),
          });
          const payload = await response.json();
          if (!response.ok || payload.ok === false) {
            throw new Error(payload.error || 'Could not finish Facebook login.');
          }
          status.textContent = 'Connected. Opening Admin…';
          const msg = encodeURIComponent(payload.pageName ? 'Connected ' + payload.pageName : 'Facebook connected');
          window.location.href = '/admin?fb=connected&msg=' + msg;
        } catch (err) {
          const message = err && err.message ? err.message : 'Facebook connect failed';
          status.className = 'err';
          status.textContent = message;
          setTimeout(() => {
            window.location.href = '/admin?fb=error&msg=' + encodeURIComponent(message);
          }, 1600);
        }
      })();
    </script>
  </body>
</html>
